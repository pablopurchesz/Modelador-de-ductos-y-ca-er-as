<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modelador de Ductos</title>
  <!-- Fuentes de Google: Barlow Condensed para títulos, IBM Plex para textos y números -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <!-- La página se divide en dos columnas: el panel a la izquierda y el visor 3D a la derecha -->
  <div id="aplicacion">

    <!-- ===================== PANEL LATERAL ===================== -->
    <aside id="panel">
      <header id="marca">
        <!-- dibujo pequeño de un codo que sirve de logo -->
        <svg width="38" height="38" viewBox="0 0 38 38">
          <path d="M4 26 H14 A10 10 0 0 0 24 16 V4" fill="none" stroke="#0b7fa6" stroke-width="7"/>
          <rect x="2" y="21" width="3" height="10" fill="#17212b"/>
          <rect x="19" y="2" width="10" height="3" fill="#17212b"/>
        </svg>
        <div>
          <h1>Modelador de Ductos</h1>
          <p>Redes de climatización · secciones en mm, largos en m</p>
        </div>
      </header>

      <!-- aquí panel.js pone el contenido según lo que esté seleccionado -->
      <section id="contexto"></section>

      <!-- mensajes de confirmación o de error -->
      <p id="mensaje"></p>
    </aside>

    <!-- ===================== VISOR 3D ===================== -->
    <main id="visor">
      <!-- Three.js agrega aquí el canvas (lo hace escena.js) -->

      <!-- barra de botones arriba del visor -->
      <div id="botones">
        <div class="grupo">
          <button id="btnIso">Isométrica</button>
          <button id="btnPlanta">Planta</button>
          <button id="btnElevacion">Elevación</button>
        </div>
        <div class="grupo">
          <button id="btnCotas">Cotas</button>
        </div>
        <div class="grupo">
          <button id="btnDeshacer">Deshacer</button>
          <button id="btnEjemplo">Ejemplo</button>
          <button id="btnNuevo">Borrar todo</button>
        </div>
        <div class="grupo">
          <button id="btnNuevoEquipo">Nuevo equipo</button>
          <!-- selector de red activa, las opciones las pone panel.js -->
          <select id="selectorRed" title="Red activa"></select>
        </div>
      </div>

      <!-- capa donde se ponen las cotas (textos) encima del canvas -->
      <div id="etiquetas"></div>

      <!-- ayuda del mouse abajo a la izquierda -->
      <div id="ayuda-mouse">Clic: seleccionar · Arrastrar: orbitar · Clic derecho: desplazar · Rueda: zoom</div>

      <!-- leyenda de colores de los accesorios, la arma main.js -->
      <div id="leyenda"></div>
    </main>
  </div>

  <!-- Librería Three.js versión r128 y los controles de cámara orbital -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <!-- Archivos del proyecto, el orden importa porque cada uno usa funciones de los anteriores -->
  <script src="js/datos.js"></script>
  <script src="js/geometria.js"></script>
  <script src="js/escena.js"></script>
  <script src="js/panel.js"></script>
  <script src="js/trazado.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
